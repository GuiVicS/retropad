<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8e8dc">
<title>RetroPad · ROMs</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RetroPad">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>

<header class="top">
  <a class="brand" href="/roms"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#gamepad-2"/></svg>RetroPad <span>ROMs</span></a>
  <div class="top-actions">
    <button class="btn ghost hidden" data-install type="button"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#download"/></svg><span class="lbl">Instalar</span></button>
    <a class="btn ghost" href="/"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#gamepad-2"/></svg><span class="lbl">Controle</span></a>
    <button class="btn ghost icon" id="theme" type="button" aria-label="Alternar tema"></button>
  </div>
</header>

<main id="app">

  <!-- Entrada com PIN -->
  <section id="login" class="card narrow hidden">
    <h1>Entrar</h1>
    <p class="muted">Digite o PIN de administrador do RetroPad.</p>
    <form id="login-form">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
    <p id="login-msg" class="msg error" role="alert"></p>
  </section>

  <!-- Sistemas e espaço livre -->
  <section id="systems" class="hidden">
    <div class="card" id="disk">
      <div class="row between"><strong><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#hard-drive"/></svg> Cartão SD</strong><span id="disk-text" class="muted"></span></div>
      <div class="meter"><div id="disk-bar"></div></div>
      <p id="tunnel" class="muted small hidden"></p>
    </div>
    <h1>Sistemas</h1>
    <div id="systems-list" class="grid"></div>
  </section>

  <!-- ROMs de um sistema -->
  <section id="roms" class="hidden">
    <div class="row">
      <a class="btn ghost" id="back" href="/roms"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#arrow-left"/></svg><span>Sistemas</span></a>
    </div>
    <h1 id="roms-title"></h1>

    <div class="card" id="sendcard">
      <div id="drop" class="drop" tabindex="0">
        <svg class="i big" aria-hidden="true"><use href="/static/lucide.svg#cloud-upload"/></svg>
        <b>Arraste os jogos para cá</b>
        <span class="muted">Centenas de arquivos de uma vez, ou uma pasta inteira</span>
        <div class="row wrap center">
          <label class="btn primary file"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#upload"/></svg><span>Escolher arquivos</span><input id="file" type="file" multiple></label>
          <label class="btn file"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#folder-open"/></svg><span>Escolher pasta</span><input id="folder" type="file" webkitdirectory multiple></label>
        </div>
      </div>
      <p class="muted small" id="accepted"></p>
      <p class="muted small" id="disk-mini"></p>

      <!-- Painel de envio: progresso total em cima, progresso do arquivo atual embaixo -->
      <div id="uploader" class="uploader hidden" aria-live="polite">
        <div class="up-head">
          <div class="up-count"><b id="upCount">0/0</b><span id="upLabel" class="muted">enviados</span></div>
          <button class="btn small ghost" id="upCancel" type="button"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#x"/></svg><span>Cancelar</span></button>
          <button class="btn small ghost hidden" id="upClose" type="button"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#check"/></svg><span>Fechar</span></button>
        </div>
        <div class="bar big" role="progressbar" aria-label="Progresso total" aria-valuemin="0" aria-valuemax="100"><div id="upBar"></div></div>
        <div class="up-meta muted"><span id="upBytes"></span><span id="upSpeed"></span><span id="upEta"></span></div>
        <div class="chips"><span class="chip ok hidden" id="upOk"></span><span class="chip skip hidden" id="upSkip"></span><span class="chip err hidden" id="upErr"></span></div>
        <div class="up-now" id="upNow">
          <div class="name" id="upName"></div>
          <div class="state muted" id="upState"></div>
          <div class="bar"><div id="upItemBar"></div></div>
        </div>
        <ul class="recent" id="upRecent"></ul>
        <details class="fails hidden" id="upFails">
          <summary><span id="upFailTitle"></span></summary>
          <ul id="upFailList"></ul>
          <button class="btn small" id="upRetry" type="button"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#refresh-cw"/></svg><span>Tentar de novo as que falharam</span></button>
        </details>
      </div>
    </div>

    <div class="card">
      <div class="row between wrap"><p class="muted small" id="count" style="margin:0"></p></div>
      <div class="searchbox"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#search"/></svg><input id="filter" type="search" placeholder="Buscar pelo nome…" autocomplete="off"></div>
      <ul id="roms-list" class="list"></ul>
      <p id="roms-empty" class="empty hidden"></p>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="dlg-form">
    <h2 id="dlg-title"></h2>
    <p id="dlg-text"></p>
    <input id="dlg-input" class="hidden" type="text" autocomplete="off">
    <label id="dlg-check-wrap" class="check hidden"><input type="checkbox" id="dlg-check"><span id="dlg-check-text"></span></label>
    <div class="row end">
      <button class="btn ghost" value="cancel" type="submit" id="dlg-cancel">Cancelar</button>
      <button class="btn primary" value="ok" type="submit" id="dlg-ok">OK</button>
    </div>
  </form>
</dialog>

<div id="dropveil" class="hidden"><svg class="i big" aria-hidden="true"><use href="/static/lucide.svg#cloud-upload"/></svg><b>Solte para enviar</b></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/static/settings.js"></script>
<script src="/static/app.js"></script>
<script src="/static/pwa.js" defer></script>
</body>
</html>
