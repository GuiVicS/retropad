<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#a855f7">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RetroPad">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/theme.css">
<script>try{var t=localStorage.getItem("rp_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>RetroPad</title>
<style>
  :root { --s: min(24vh, 17vw); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--font);
    overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .hidden { display: none !important; }

  /* Tela de entrada */
  #join {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 20px; text-align: center;
  }
  #join h1 { font-size: 1.8rem; letter-spacing: -0.03em; }
  #join input {
    font-size: 1.1rem; padding: 12px; width: 220px; text-align: center;
    border-radius: 999px; border: 2px solid var(--border); background: var(--input); color: var(--text);
  }
  #join .players { display: flex; gap: 14px; }
  #join button {
    font: inherit; font-weight: 700; font-size: 1.2rem; padding: 16px 26px; min-width: 130px;
    border: 2px solid var(--border); border-radius: 999px; box-shadow: var(--shadow-md);
    background: var(--primary); color: var(--primary-foreground);
  }
  #join button:active { transform: translate(3px, 3px); box-shadow: none; }
  #join button.themebtn { min-width: 0; font-size: 0.95rem; padding: 8px 18px; background: var(--card); color: var(--card-foreground); box-shadow: none; }
  #join .admin { color: var(--muted-foreground); font-size: 0.95rem; }
  #status { min-height: 1.2em; color: var(--danger-text); font-weight: 600; font-size: 0.95rem; }

  /* Aviso de rotação */
  #rotate {
    position: fixed; inset: 0; background: var(--bg); display: none;
    align-items: center; justify-content: center; text-align: center;
    font-size: 1.2rem; padding: 20px; z-index: 10;
  }
  body.game #rotate { display: none; }
  @media (orientation: portrait) {
    body.game #rotate { display: flex; }
  }

  /* Controle */
  #pad {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .btn {
    position: absolute; display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 3px solid var(--border); color: var(--card-foreground);
    box-shadow: 3px 3px 0 var(--shadow-color);
    font-weight: 800; font-size: calc(var(--s) * 0.32);
  }
  .btn.on { background: var(--primary); color: var(--primary-foreground); box-shadow: none; }

  /* Ombros */
  .shoulder {
    width: calc(var(--s) * 2.2); height: calc(var(--s) * 0.6);
    border-radius: 999px; top: 4%;
  }
  .shoulder.l { left: 3%; }
  .shoulder.r { right: 3%; }

  /* D-pad: 3x3 em cruz */
  #dpad { position: absolute; left: 3%; bottom: 6%; width: calc(var(--s) * 3); height: calc(var(--s) * 3); }
  #dpad .btn { width: var(--s); height: var(--s); border-radius: 12px; }
  #dpad .up    { left: var(--s); top: 0; }
  #dpad .down  { left: var(--s); top: calc(var(--s) * 2); }
  #dpad .left  { left: 0; top: var(--s); }
  #dpad .right { left: calc(var(--s) * 2); top: var(--s); }

  /* ABXY em losango */
  #abxy { position: absolute; right: 3%; bottom: 6%; width: calc(var(--s) * 3); height: calc(var(--s) * 3); }
  #abxy .btn { width: var(--s); height: var(--s); border-radius: 50%; }
  #abxy .x { left: var(--s); top: 0; }
  #abxy .y { left: 0; top: var(--s); }
  #abxy .b { left: calc(var(--s) * 2); top: var(--s); }
  #abxy .a { left: var(--s); top: calc(var(--s) * 2); }

  /* Select / Start */
  #center { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); display: flex; gap: 18px; }
  #center .btn { position: relative; width: calc(var(--s) * 1.3); height: calc(var(--s) * 0.5); border-radius: 999px; font-size: calc(var(--s) * 0.22); }
</style>
</head>
<body>

<section id="join">
  <h1>RetroPad</h1>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN (se houver)" autocomplete="off">
  <div class="players">
    <button id="p1">Jogador 1</button>
    <button id="p2">Jogador 2</button>
  </div>
  <div id="status"></div>
  <a class="admin" href="/admin">Gerenciar ROMs</a>
  <button id="theme" class="themebtn" type="button">☀ / ☾ Tema</button>
  <button class="themebtn hidden" data-install type="button">⬇ Instalar app</button>
</section>

<div id="rotate">Gire o celular para o modo paisagem</div>

<main id="pad" class="hidden">
  <div class="btn shoulder l" data-btn="l">L</div>
  <div class="btn shoulder r" data-btn="r">R</div>

  <div id="dpad">
    <div class="btn up" data-btn="up">▲</div>
    <div class="btn left" data-btn="left">◀</div>
    <div class="btn right" data-btn="right">▶</div>
    <div class="btn down" data-btn="down">▼</div>
  </div>

  <div id="abxy">
    <div class="btn x" data-btn="x">X</div>
    <div class="btn y" data-btn="y">Y</div>
    <div class="btn b" data-btn="b">B</div>
    <div class="btn a" data-btn="a">A</div>
  </div>

  <div id="center">
    <div class="btn" data-btn="select">SELECT</div>
    <div class="btn" data-btn="start">START</div>
  </div>
</main>

<script>
(() => {
  const joinEl = document.getElementById('join');
  const padEl = document.getElementById('pad');
  const statusEl = document.getElementById('status');
  const pinEl = document.getElementById('pin');

  let ws = null;
  let player = null;
  let retry = false;
  let inGame = false;
  let lastSent = '';

  // Estado atual: toques ativos e o que está pressionado
  const padButtons = [...document.querySelectorAll('[data-btn]')];

  function setStatus(text) { statusEl.textContent = text; }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      ws.send(JSON.stringify({ t: 'join', player, pin: pinEl.value.trim() }));
    };

    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.t === 'joined') {
        enterGame();
      } else if (m.t === 'error') {
        retry = false;
        setStatus(m.msg);
      }
    };

    ws.onclose = () => {
      if (inGame && retry) {
        setStatus('Reconectando...');
        setTimeout(connect, 1500);
      } else if (!inGame) {
        setStatus(retry ? 'Não foi possível conectar' : statusEl.textContent);
        retry = false;
      }
    };
  }

  function startJoin(p) {
    player = p;
    retry = true;
    setStatus('Conectando...');
    // Em Android, tenta entrar em tela cheia (precisa de gesto do usuário)
    try { document.documentElement.requestFullscreen?.(); } catch (_) {}
    connect();
  }

  function enterGame() {
    inGame = true;
    setStatus('');
    joinEl.classList.add('hidden');
    padEl.classList.remove('hidden');
    document.body.classList.add('game');
  }

  function send(buttons, hat) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const payload = JSON.stringify({ t: 'state', buttons, hat });
    if (payload !== lastSent) {
      ws.send(payload);
      lastSent = payload;
    }
  }

  // Lê todos os toques ativos e converte em botões + direção
  function readTouches(e) {
    const buttons = new Set();
    let hx = 0, hy = 0;

    for (const t of e.touches) {
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const target = el && el.closest('[data-btn]');
      if (!target) continue;
      const name = target.dataset.btn;
      if (name === 'left') hx -= 1;
      else if (name === 'right') hx += 1;
      else if (name === 'up') hy -= 1;
      else if (name === 'down') hy += 1;
      else buttons.add(name);
    }

    hx = Math.max(-1, Math.min(1, hx));
    hy = Math.max(-1, Math.min(1, hy));

    // Destaque visual
    for (const b of padButtons) {
      const name = b.dataset.btn;
      const on = ['up', 'down', 'left', 'right'].includes(name)
        ? (name === 'left' && hx < 0) || (name === 'right' && hx > 0) ||
          (name === 'up' && hy < 0) || (name === 'down' && hy > 0)
        : buttons.has(name);
      b.classList.toggle('on', on);
    }

    send([...buttons], [hx, hy]);
  }

  const touchHandler = (e) => { e.preventDefault(); readTouches(e); };
  for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
    padEl.addEventListener(type, touchHandler, { passive: false });
  }

  // Solta tudo se o app for para o segundo plano
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) send([], [0, 0]);
  });

  document.getElementById('theme').onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('rp_theme', root.dataset.theme); } catch (_) {}
  };

  document.getElementById('p1').onclick = () => startJoin(1);
  document.getElementById('p2').onclick = () => startJoin(2);
})();
</script>
<script src="/static/pwa.js" defer></script>
</body>
</html>
