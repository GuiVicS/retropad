<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8e8dc">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RetroPad">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/theme.css">
<script>try{var t=localStorage.getItem("rp_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>RetroPad</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font);
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .hidden { display: none !important; }
  .i { width: 1.2em; height: 1.2em; flex: none; vertical-align: -0.22em; pointer-events: none;
       fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .i.fill { fill: currentColor; }

  /* Botão "macio": relevo claro, vira marrom quando pressionado */
  .soft {
    background: linear-gradient(180deg, var(--hi), var(--lo)); color: var(--ink);
    border: 1.5px solid var(--line);
    box-shadow: 0 0.7vh 1.5vh var(--shade), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .soft.on, .soft:active {
    background: linear-gradient(180deg, var(--brown), var(--brown-d)); color: var(--on-brown);
    box-shadow: inset 0 0.7vh 1.4vh rgba(0, 0, 0, 0.3); transform: translateY(1px);
  }
  .dark { background: linear-gradient(180deg, var(--brown), var(--brown-d)); color: var(--on-brown); border-color: transparent; }
  .dark.on { filter: brightness(0.82); }

  /* ---------- Tela de entrada ---------- */
  #join {
    height: 100%; overflow-y: auto; touch-action: pan-y; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: max(16px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom));
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; }
  .logo .i { width: 1.35em; height: 1.35em; color: var(--brown); }
  #pin {
    font: inherit; font-size: 1.05rem; padding: 12px 16px; width: min(280px, 80vw); text-align: center;
    border-radius: 999px; border: 1.5px solid var(--line); background: var(--hi); color: var(--ink);
    box-shadow: inset 0 2px 5px var(--shade); user-select: text; -webkit-user-select: text;
  }
  #pin::placeholder { color: var(--muted); }
  #pin:focus-visible, .seg button:focus-visible, .cta:focus-visible, .link-btn:focus-visible { outline: 3px solid var(--brown); outline-offset: 2px; }
  .seg { display: flex; padding: 4px; border-radius: 999px; background: var(--panel); border: 1.5px solid var(--line); box-shadow: inset 0 2px 5px var(--shade); }
  .seg button { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 0.95rem; color: var(--muted); }
  .seg button.on { background: linear-gradient(180deg, var(--brown), var(--brown-d)); color: var(--on-brown); box-shadow: 0 3px 8px var(--shade); }
  .players { display: flex; gap: 14px; }
  .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 800; font-size: 1.1rem; padding: 14px 26px; min-width: 140px; border-radius: 999px;
    background: linear-gradient(180deg, var(--brown), var(--brown-d)); color: var(--on-brown);
    box-shadow: 0 6px 14px var(--shade), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .cta:active { transform: translateY(2px); box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.3); }
  #status { min-height: 1.2em; color: var(--danger); font-weight: 700; font-size: 0.95rem; }
  .join-links { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; justify-content: center; color: var(--muted); }
  .join-links a { color: var(--muted); font-size: 0.95rem; }
  .link-btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; color: var(--ink); background: var(--panel); border: 1.5px solid var(--line); }
  @media (max-height: 460px) {
    #join { gap: 9px; }
    .logo { font-size: 1.3rem; }
    .cta { padding: 10px 24px; font-size: 1rem; }
    .seg button { padding: 8px 16px; }
  }

  /* ---------- Base do controle ---------- */
  #rotate {
    position: fixed; inset: 0; background: var(--bg); display: none; z-index: 30;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center;
    font-size: 1.15rem; font-weight: 700; padding: 20px; color: var(--ink);
  }
  #rotate .i { width: 2.6em; height: 2.6em; color: var(--brown); }
  @media (orientation: portrait) { body.game.m-gamepad #rotate { display: flex; } }
  #pad { position: fixed; left: 0; right: 0; top: 0; height: 100%; }
  .screen { position: absolute; inset: 0; }
  #toast {
    position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 40; pointer-events: none;
    background: var(--brown-d); color: var(--on-brown); padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: 0.85rem;
  }

  /* ---------- Gamepad universal (um só layout) ---------- */
  #gamepad { z-index: 1; background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.4px); background-size: 3.2vh 3.2vh; }
  #gamepad > * { position: absolute; }
  .sh { display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 3.6vh; }
  .sh.l2, .sh.r2 { top: 4vh; width: 32vh; height: 10vh; border-radius: 3vh 3vh 5vh 5vh; }
  .sh.l1, .sh.r1 { top: 12.4vh; width: 30vh; height: 9vh; border-radius: 4.5vh; z-index: 1; }
  .sh.l2 { left: 5vw; } .sh.l1 { left: 4vw; }
  .sh.r2 { right: 6vw; } .sh.r1 { right: 4vw; }
  .gear { top: 2.5vh; right: 1.5vw; width: 9vh; height: 9vh; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 3; }
  .gear .i { width: 4.6vh; height: 4.6vh; }

  .stick {
    width: 31vh; height: 31vh; border-radius: 50%; touch-action: none;
    background: radial-gradient(circle at 50% 40%, var(--lo), var(--hi) 75%);
    border: 1.5px solid var(--line); box-shadow: inset 0 1vh 2vh var(--shade);
  }
  .stick.l { left: 3.5vw; top: 29vh; } .stick.r { right: 6vw; bottom: 3vh; }
  .stick .knob {
    position: absolute; left: 50%; top: 50%; width: 66%; height: 66%; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 50% 35%, #8f6450, var(--brown-d) 80%); border: 0.9vh solid var(--brown-d);
    box-shadow: 0 1vh 2vh var(--shade), inset 0 0 0 1.2vh rgba(255, 235, 220, 0.12);
    transform: translate(calc(-50% + var(--kx, 0px)), calc(-50% + var(--ky, 0px)));
  }
  .stick .knob::after { content: ''; position: absolute; inset: 18%; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #a77a64, #7a4f3b); box-shadow: inset 0 0.5vh 1vh rgba(0,0,0,0.25); }
  .mini { width: 8vh; height: 8vh; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 2.6vh; }
  .mini.l3 { left: calc(3.5vw + 33vh); top: 53vh; } .mini.r3 { right: calc(4.5vw + 34vh); top: 55vh; }

  #dpad { left: 5vw; bottom: 3vh; width: 31vh; height: 31vh; touch-action: none; }
  #dpad .arm { position: absolute; border-radius: 2vh; pointer-events: none; }
  #dpad .arm.v { left: 33%; top: 0; width: 34%; height: 100%; }
  #dpad .arm.h { left: 0; top: 33%; width: 100%; height: 34%; }
  #dpad .arm.h { z-index: 0; }
  #dpad .cover { position: absolute; left: 31.5%; top: 31.5%; width: 37%; height: 37%; border-radius: 1.4vh; background: linear-gradient(180deg, var(--hi), var(--lo)); pointer-events: none; z-index: 1; }
  #dpad .tri { position: absolute; width: 4.2vh; height: 4.2vh; z-index: 2; color: var(--brown-d); transition: color .05s; pointer-events: none; fill: currentColor; stroke-width: 1.5; }
  #dpad .tri.on { color: var(--danger); }
  #dpad .tri.up { left: calc(50% - 2.1vh); top: 5%; } #dpad .tri.down { left: calc(50% - 2.1vh); bottom: 5%; transform: rotate(180deg); }
  #dpad .tri.left { top: calc(50% - 2.1vh); left: 5%; transform: rotate(-90deg); } #dpad .tri.right { top: calc(50% - 2.1vh); right: 5%; transform: rotate(90deg); }

  .face { right: 4.5vw; top: 31vh; display: grid; grid-template: repeat(3, 9.8vh) / repeat(3, 9.8vh); }
  .face .btn { width: 12.4vh; height: 12.4vh; place-self: center; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 4.4vh; }
  .face .y { grid-area: 1 / 2; } .face .x { grid-area: 2 / 1; } .face .b { grid-area: 2 / 3; } .face .a { grid-area: 3 / 2; }

  .pills { left: 50%; bottom: 4vh; transform: translateX(-50%); display: flex; gap: 3.5vh; }
  .pill { display: flex; align-items: center; justify-content: center; gap: 1.6vh; width: 27vh; height: 9vh; border-radius: 4.5vh; font-weight: 800; font-size: 3vh; letter-spacing: 0.02em; }
  .pill .i { width: 3.4vh; height: 3.4vh; }

  /* Feixe de vídeo (streaming) */
  .feed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: none; pointer-events: none; }
  #screenFull { z-index: 0; }
  body.stream.m-gamepad #screenFull { display: block; }
  body.live.m-gamepad #gamepad { background-image: none; background-color: transparent; }
  body.live.m-gamepad #gamepad .soft, body.live.m-gamepad .stick { opacity: 0.6; }
  body.live.m-gamepad #gamepad .soft.on { opacity: 1; }
  body.live.m-gamepad .gear { opacity: 0.9 !important; }

  /* ---------- Menu da engrenagem ---------- */
  #sheetBack { position: fixed; inset: 0; z-index: 50; background: rgba(40, 20, 10, 0.35); }
  #menu {
    position: fixed; z-index: 51; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); width: min(300px, 86vw);
    background: var(--bg); border: 1.5px solid var(--line); border-radius: 22px; padding: 8px; box-shadow: 0 14px 40px var(--shade);
  }
  #menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px; border-radius: 14px; font-weight: 700; font-size: 1rem; text-align: left; color: var(--ink); }
  #menu button:active, #menu button.on { background: var(--panel); }
  #menu button .state { margin-left: auto; font-size: 0.78rem; color: var(--muted); }
  #menu button.danger { color: var(--danger); }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 8px; }

  #streamMsg {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 35; max-width: min(92vw, 520px);
    display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px; border-radius: 22px; line-height: 1.4;
    background: var(--bg); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 10px 30px var(--shade); font-weight: 700; font-size: 0.88rem;
  }
  #streamMsg.err { background: var(--danger); color: #fff; border-color: transparent; }
  #streamMsg button { white-space: nowrap; flex: none; padding: 7px 14px; border-radius: 999px; background: var(--bg); color: var(--ink); font-weight: 800; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  /* ---------- Mouse (touchpad) + teclado ---------- */
  #touchpad { display: flex; flex-direction: column; gap: 10px; padding: max(12px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  #surface {
    position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; border-radius: 26px;
    background-color: var(--panel); border: 1.5px solid var(--line);
    background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.6px); background-size: 3.4vh 3.4vh; background-position: 1.7vh 1.7vh;
  }
  #surface.live { background-image: none; background-color: #000; }
  #surface.stream .feed { display: block; border-radius: 25px; }
  #surface .gear2 { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 3; opacity: 0.8; }
  #fab { position: absolute; right: 14px; bottom: 14px; width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 3; }
  #fab .i { width: 30px; height: 30px; }
  #hint { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); width: max-content; max-width: 80%; text-align: center; pointer-events: none;
    color: var(--muted); font-weight: 700; font-size: 0.95rem; line-height: 1.5; background: var(--panel); border-radius: 16px; padding: 8px 14px; }
  #surface.live #hint { display: none; }
  .ring { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; pointer-events: none; z-index: 2;
    border: 2.5px solid var(--brown); background: color-mix(in oklab, var(--brown) 22%, transparent); }

  /* Folha de teclas extras (aparece junto do teclado do celular) */
  #keysheet { border-radius: 22px 22px 0 0; background: var(--bg); box-shadow: 0 -6px 18px var(--shade); padding: 6px 10px 8px; margin: 0 -2px -4px; }
  #keysheet .grab { width: 54px; height: 5px; border-radius: 3px; background: var(--line); margin: 2px auto 8px; }
  .krow { display: flex; gap: 7px; margin-bottom: 7px; }
  .krow:last-child { margin-bottom: 0; }
  .krow.scroll { overflow-x: auto; touch-action: pan-x; scrollbar-width: none; }
  .krow.scroll::-webkit-scrollbar { display: none; }
  .k { flex: 1 1 0; min-width: 0; height: 44px; padding: 0 2px; overflow: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: 700; font-size: 0.82rem; white-space: nowrap; letter-spacing: -0.02em; }
  .krow.scroll .k { flex: 0 0 56px; }
  .k .i { width: 1.25em; height: 1.25em; }
  .k.fn { flex-direction: column; gap: 0; line-height: 1.05; }
  .k.fn small { font-size: 0.58rem; font-weight: 600; opacity: 0.85; letter-spacing: -0.04em; }
  .k.wide { flex: 2 1 0; }
  #kbInput { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; resize: none; pointer-events: none; user-select: text; -webkit-user-select: text; }
</style>
</head>
<body>

<section id="join">
  <div class="logo"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#gamepad-2"/></svg> RetroPad</div>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN (se houver)" autocomplete="off" aria-label="PIN">

  <div class="seg" id="modeSeg" role="group" aria-label="Modo de controle">
    <button type="button" data-mode="gamepad"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#gamepad-2"/></svg> Gamepad</button>
    <button type="button" data-mode="mouse"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#mouse-pointer-2"/></svg> Mouse</button>
    <button type="button" data-mode="screen"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#monitor-play"/></svg> Tela</button>
  </div>

  <div class="players" id="players">
    <button type="button" class="cta" id="p1">Jogador 1</button>
    <button type="button" class="cta" id="p2">Jogador 2</button>
  </div>
  <button type="button" class="cta hidden" id="connect"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#log-in"/></svg> Conectar</button>
  <div id="status" role="status"></div>

  <div class="join-links">
    <a href="/admin">Gerenciar ROMs</a>
    <button id="theme" class="link-btn" type="button"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#sun-moon"/></svg> Tema</button>
    <button class="link-btn hidden" data-install type="button"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#download"/></svg> Instalar app</button>
  </div>
</section>

<div id="rotate"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#gamepad-2"/></svg>Gire o celular para o modo paisagem</div>
<div id="toast" class="hidden" role="status"></div>
<div id="streamMsg" class="hidden" role="status"></div>

<main id="pad" class="hidden">

  <!-- ================= GAMEPAD UNIVERSAL ================= -->
  <canvas id="screenFull" class="feed"></canvas>
  <div id="gamepad" class="screen">
    <div class="sh l2 soft dark" data-btn="l2">L2</div>
    <div class="sh l1 soft" data-btn="l">L1</div>
    <div class="sh r2 soft dark" data-btn="r2">R2</div>
    <div class="sh r1 soft" data-btn="r">R1</div>
    <button type="button" class="gear soft dark" data-open-menu aria-label="Menu"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#settings"/></svg></button>

    <div class="stick l" data-stick="l"><div class="knob"></div></div>
    <div class="mini l3 soft dark" data-btn="l3">L3</div>
    <div id="dpad" aria-label="Direcional">
      <div class="arm v soft"></div><div class="arm h soft"></div><div class="cover"></div>
      <svg class="i tri up" data-dir="up"><use href="/static/lucide.svg#triangle"/></svg>
      <svg class="i tri down" data-dir="down"><use href="/static/lucide.svg#triangle"/></svg>
      <svg class="i tri left" data-dir="left"><use href="/static/lucide.svg#triangle"/></svg>
      <svg class="i tri right" data-dir="right"><use href="/static/lucide.svg#triangle"/></svg>
    </div>

    <div class="pills">
      <div class="pill soft" data-btn="select"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#menu"/></svg>SELECT</div>
      <div class="pill soft" data-btn="start"><svg class="i fill" aria-hidden="true"><use href="/static/lucide.svg#play"/></svg>START</div>
    </div>

    <div class="face">
      <div class="btn y soft" data-btn="y">Y</div>
      <div class="btn x soft" data-btn="x">X</div>
      <div class="btn b soft" data-btn="b">B</div>
      <div class="btn a soft" data-btn="a">A</div>
    </div>
    <div class="mini r3 soft dark" data-btn="r3">R3</div>
    <div class="stick r" data-stick="r"><div class="knob"></div></div>
  </div>

  <!-- ================= MOUSE + TECLADO ================= -->
  <div id="touchpad" class="screen hidden">
    <div id="surface">
      <canvas id="screenSurf" class="feed"></canvas>
      <div id="hint"><b>Arraste</b> para mover · toque para clicar<br>dois dedos: rolar ou clique direito</div>
      <button type="button" class="gear2 soft" data-open-menu aria-label="Menu"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#settings"/></svg></button>
      <button type="button" id="fab" class="soft dark" aria-label="Teclado do celular"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#keyboard"/></svg></button>
    </div>
    <div id="keysheet" class="hidden">
      <div class="grab"></div>
      <div class="krow scroll hidden" id="frow"></div>
      <div class="krow" id="row1"></div>
      <div class="krow" id="row2"></div>
    </div>
    <textarea id="kbInput" rows="1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Entrada de texto"></textarea>
  </div>
</main>

<div id="sheetBack" class="hidden"></div>
<div id="menu" class="hidden" role="menu">
  <button type="button" id="mScreen"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#monitor-play"/></svg>Tela do sistema<span class="state" id="mScreenState">desligada</span></button>
  <button type="button" id="mTheme"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#sun-moon"/></svg>Alternar tema</button>
  <hr>
  <button type="button" id="mExit" class="danger"><svg class="i" aria-hidden="true"><use href="/static/lucide.svg#log-out"/></svg>Sair</button>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const joinEl = $('join'), padEl = $('pad'), statusEl = $('status'), pinEl = $('pin');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  };
  const ico = (name, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="/static/lucide.svg#${name}"/></svg>`;

  const MODES = ['gamepad', 'mouse', 'screen'];
  let mode = store.get('rp_mode'); if (mode === 'keyboard') mode = 'mouse';
  if (!MODES.includes(mode)) mode = 'gamepad';
  let ws = null, player = null, retry = false, inGame = false;

  const setStatus = (text) => { statusEl.textContent = text; };
  let toastTimer = 0;
  function toast(text, ms = 1800) {
    const el = $('toast'); el.textContent = text; el.classList.remove('hidden');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add('hidden'), ms);
  }
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} };

  // ---------- Tema ----------
  function toggleTheme() {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    store.set('rp_theme', root.dataset.theme);
  }
  $('theme').onclick = toggleTheme;

  // ---------- Tela de entrada ----------
  function paintJoin() {
    document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
    const gp = mode === 'gamepad';
    $('players').classList.toggle('hidden', !gp);
    $('connect').classList.toggle('hidden', gp);
  }
  document.querySelectorAll('#modeSeg button').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.mode; store.set('rp_mode', mode); paintJoin();
  }));

  // ---------- Conexão ----------
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const sock = new WebSocket(`${proto}://${location.host}/ws`);
    ws = sock;
    ws.onopen = () => {
      const join = { t: 'join', pin: pinEl.value.trim(), mode: mode === 'gamepad' ? 'gamepad' : 'touchpad' };
      if (mode === 'gamepad') join.player = player;
      ws.send(JSON.stringify(join));
    };
    ws.onmessage = (ev) => {
      if (sock !== ws) return;
      if (typeof ev.data !== 'string') { onFrame(ev.data); return; }
      const m = JSON.parse(ev.data);
      if (m.t === 'joined') { if (!inGame) enterGame(); else { toast('Reconectado'); if (streaming) wsSend({ t: 'stream', on: true }); } }
      else if (m.t === 'stream') onStreamMsg(m);
      else if (m.t === 'error') { retry = false; setStatus(m.msg); if (inGame) leaveGame(); }
    };
    ws.onclose = () => {
      if (sock !== ws) return;   // socket antigo (já substituído): ignora
      if (inGame && retry) { toast('Reconectando…', 3000); setTimeout(connect, 1500); }
      else if (!inGame && retry) { retry = false; setStatus('Não foi possível conectar'); }
    };
  }
  function startJoin(p) {
    player = p; retry = true; setStatus('Conectando…');
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch (_) {}
    connect();
  }
  $('p1').onclick = () => startJoin(1);
  $('p2').onclick = () => startJoin(2);
  $('connect').onclick = () => startJoin(null);
  const wsSend = (obj) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); };

  function enterGame() {
    inGame = true; setStatus('');
    joinEl.classList.add('hidden'); padEl.classList.remove('hidden');
    document.body.classList.add('game');
    const gp = mode === 'gamepad';
    document.body.classList.toggle('m-gamepad', gp);
    $('gamepad').classList.toggle('hidden', !gp);
    $('touchpad').classList.toggle('hidden', gp);
    fit();
    if (mode === 'screen' || store.get('rp_stream') === '1') startStream();
  }
  function leaveGame() {
    retry = false; inGame = false;
    pressed.clear(); lastPad = '';
    if (streaming) wsSend({ t: 'stream', on: false });   // para o vídeo antes de fechar o socket
    streaming = false; gotFrame = false; paintStream(); hideMsg(); closeMenu();
    const old = ws; ws = null;
    try { if (old) old.close(); } catch (_) {}
    kb.blur();
    padEl.classList.add('hidden'); joinEl.classList.remove('hidden');
    document.body.classList.remove('game');
  }

  // O teclado do celular encolhe a tela: acompanhamos a área realmente visível.
  function fit() {
    const vv = window.visualViewport;
    padEl.style.height = vv ? vv.height + 'px' : '';
    padEl.style.transform = vv && vv.offsetTop ? `translateY(${vv.offsetTop}px)` : '';
  }
  if (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }

  // ---------- Menu (engrenagem) ----------
  const openMenu = () => { $('sheetBack').classList.remove('hidden'); $('menu').classList.remove('hidden'); paintStream(); };
  function closeMenu() { $('sheetBack').classList.add('hidden'); $('menu').classList.add('hidden'); }
  document.querySelectorAll('[data-open-menu]').forEach((b) => b.addEventListener('click', openMenu));
  $('sheetBack').addEventListener('click', closeMenu);
  $('mTheme').addEventListener('click', () => { toggleTheme(); closeMenu(); });
  $('mScreen').addEventListener('click', () => { closeMenu(); toggleStream(); });
  $('mExit').addEventListener('click', () => { closeMenu(); leaveGame(); });

  // ---------- Gamepad ----------
  const pressed = new Set();
  const axes = { x: 0, y: 0, rx: 0, ry: 0 };
  let hat = [0, 0], lastPad = '';
  function sendPad() {
    const payload = JSON.stringify({ t: 'state', buttons: [...pressed], hat, axes });
    if (payload === lastPad) return;
    lastPad = payload;
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(payload);
  }
  function holdable(el, onDown, onUp) {
    const ids = new Set();
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) {}
      ids.add(e.pointerId); el.classList.add('on'); buzz(); onDown();
    });
    const up = (e) => { ids.delete(e.pointerId); if (!ids.size) { el.classList.remove('on'); onUp(); } };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  }
  document.querySelectorAll('#gamepad [data-btn]').forEach((el) => {
    const name = el.dataset.btn;
    holdable(el, () => { pressed.add(name); sendPad(); }, () => { pressed.delete(name); sendPad(); });
  });
  // D-pad: uma peça só, a direção vem de onde o dedo está (aceita diagonal e deslizar)
  const dpad = $('dpad'), tris = [...dpad.querySelectorAll('[data-dir]')];
  function dpadAt(e) {
    const r = dpad.getBoundingClientRect(), t = 0.17;
    const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    hat = [x < -t ? -1 : x > t ? 1 : 0, y < -t ? -1 : y > t ? 1 : 0];
    for (const d of tris) {
      const k = d.dataset.dir;
      d.classList.toggle('on', (k === 'left' && hat[0] < 0) || (k === 'right' && hat[0] > 0) || (k === 'up' && hat[1] < 0) || (k === 'down' && hat[1] > 0));
    }
    sendPad();
  }
  let dpadId = null;
  dpad.addEventListener('pointerdown', (e) => { e.preventDefault(); dpadId = e.pointerId; dpad.setPointerCapture(e.pointerId); buzz(); dpadAt(e); });
  dpad.addEventListener('pointermove', (e) => { if (e.pointerId === dpadId) dpadAt(e); });
  const dpadUp = (e) => {
    if (e.pointerId !== dpadId) return;
    dpadId = null; hat = [0, 0]; tris.forEach((d) => d.classList.remove('on')); sendPad();
  };
  dpad.addEventListener('pointerup', dpadUp); dpad.addEventListener('pointercancel', dpadUp);
  // Analógicos
  document.querySelectorAll('.stick').forEach((el) => {
    const names = el.dataset.stick === 'r' ? ['rx', 'ry'] : ['x', 'y'];
    let id = null;
    const move = (e) => {
      const r = el.getBoundingClientRect(), R = r.width / 2;
      let dx = (e.clientX - r.left - R) / R, dy = (e.clientY - r.top - R) / R;
      const len = Math.hypot(dx, dy);
      if (len > 1) { dx /= len; dy /= len; }
      el.style.setProperty('--kx', `${dx * R * 0.4}px`); el.style.setProperty('--ky', `${dy * R * 0.4}px`);
      axes[names[0]] = +dx.toFixed(2); axes[names[1]] = +dy.toFixed(2); sendPad();
    };
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); id = e.pointerId; el.setPointerCapture(id); move(e); });
    el.addEventListener('pointermove', (e) => { if (e.pointerId === id) move(e); });
    const end = (e) => {
      if (e.pointerId !== id) return;
      id = null; el.style.removeProperty('--kx'); el.style.removeProperty('--ky');
      axes[names[0]] = 0; axes[names[1]] = 0; sendPad();
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  });
  // Solta tudo se o app for para o segundo plano
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden || mode !== 'gamepad') return;
    pressed.clear(); hat = [0, 0]; Object.keys(axes).forEach((k) => { axes[k] = 0; }); sendPad();
  });

  // ---------- Tela do sistema (streaming) ----------
  // O servidor manda um JPEG por mensagem binária; desenhamos o mais recente (quadros atrasados são descartados).
  const surfaceEl = $('surface'), cvFull = $('screenFull'), cvSurf = $('screenSurf'), msgEl = $('streamMsg');
  let streaming = false, gotFrame = false, decoding = false, pending = null;
  function showMsg(text, error) {
    msgEl.className = error ? 'err' : '';
    msgEl.innerHTML = `${ico(error ? 'monitor-off' : 'loader-circle', error ? '' : 'spin')}<span></span>`;
    msgEl.lastChild.textContent = text;
    if (error) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Tentar de novo';
      b.onclick = () => startStream(); msgEl.append(b);
    }
  }
  const hideMsg = () => msgEl.classList.add('hidden');
  function paintStream() {
    const live = streaming && gotFrame;
    document.body.classList.toggle('stream', streaming);
    document.body.classList.toggle('live', live);
    surfaceEl.classList.toggle('stream', streaming);
    surfaceEl.classList.toggle('live', live);
    $('mScreen').classList.toggle('on', streaming);
    $('mScreenState').textContent = streaming ? 'ligada' : 'desligada';
    $('mScreen').firstElementChild.outerHTML = ico(streaming ? 'monitor-off' : 'monitor-play');
  }
  function startStream() {
    if (!inGame) return;
    streaming = true; gotFrame = false; store.set('rp_stream', '1');
    showMsg('Carregando a tela do sistema…'); msgEl.classList.remove('hidden');
    paintStream(); wsSend({ t: 'stream', on: true });
  }
  function stopStream() {
    streaming = false; gotFrame = false; store.set('rp_stream', '0');
    wsSend({ t: 'stream', on: false }); hideMsg(); paintStream();
  }
  const toggleStream = () => (streaming ? stopStream() : startStream());
  function onStreamMsg(m) {
    if (m.state === 'error') { streaming = false; gotFrame = false; paintStream(); showMsg(m.msg || 'Falha na transmissão', true); msgEl.classList.remove('hidden'); }
  }
  function onFrame(blob) {
    if (!streaming) return;
    if (decoding) { pending = blob; return; }
    decoding = true;
    createImageBitmap(blob).then((bmp) => {
      const cv = mode === 'gamepad' ? cvFull : cvSurf;
      if (cv.width !== bmp.width || cv.height !== bmp.height) { cv.width = bmp.width; cv.height = bmp.height; }
      cv.getContext('2d').drawImage(bmp, 0, 0);
      if (bmp.close) bmp.close();
      if (!gotFrame) { gotFrame = true; hideMsg(); paintStream(); }
    }).catch(() => {}).finally(() => {
      decoding = false;
      if (pending) { const next = pending; pending = null; onFrame(next); }
    });
  }
  // Fechou a aba ou saiu do app: avisa o servidor para parar o vídeo antes da conexão cair.
  window.addEventListener('pagehide', () => { if (streaming) wsSend({ t: 'stream', on: false }); });

  // ---------- Touchpad ----------
  const surface = surfaceEl;
  const SENS = 1.7;                       // velocidade do cursor
  const TAP_MS = 230, TAP_PX = 9, DRAG_GAP_MS = 320;
  let mx = 0, my = 0, sv = 0, raf = 0;    // acumuladores enviados a cada quadro
  const touches = new Map();              // id -> {x, y, sx, sy, t, moved}
  let lastTap = 0, dragging = false, twoMoved = false, twoStart = 0;

  function flush() {
    raf = 0;
    const dx = Math.round(mx), dy = Math.round(my), v = Math.trunc(sv);
    if (dx || dy) { wsSend({ t: 'move', dx, dy }); mx -= dx; my -= dy; }
    if (v) { wsSend({ t: 'scroll', v }); sv -= v; }
  }
  const queue = () => { if (!raf) raf = requestAnimationFrame(flush); };
  const click = (b, down) => wsSend({ t: 'click', b, down });
  const tapClick = (b) => { click(b, true); click(b, false); };

  const rings = new Map();
  function ring(id, x, y) {
    let el = rings.get(id);
    if (!el) { el = document.createElement('div'); el.className = 'ring'; surface.appendChild(el); rings.set(id, el); }
    const r = surface.getBoundingClientRect();
    el.style.left = (x - r.left) + 'px'; el.style.top = (y - r.top) + 'px';
  }
  function unring(id) { const el = rings.get(id); if (el) { el.remove(); rings.delete(id); } }

  surface.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;      // engrenagem e botão de teclado têm o próprio toque
    e.preventDefault(); surface.setPointerCapture(e.pointerId);
    const now = performance.now();
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: now, moved: false });
    ring(e.pointerId, e.clientX, e.clientY);
    if (touches.size === 1) {
      // toque, e logo em seguida encostar e arrastar = segurar o botão (arrastar janelas, selecionar texto)
      if (now - lastTap < DRAG_GAP_MS) { dragging = true; click('left', true); }
    } else if (touches.size === 2) { twoMoved = false; twoStart = now; }
  });
  surface.addEventListener('pointermove', (e) => {
    const p = touches.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (Math.hypot(p.x - p.sx, p.y - p.sy) > TAP_PX) p.moved = true;
    ring(e.pointerId, e.clientX, e.clientY);
    if (touches.size === 1) {
      if (!p.moved) return;                    // ignora tremida do dedo parado
      mx += dx * SENS; my += dy * SENS; queue();
    } else if (touches.size === 2) {
      if (p.moved) twoMoved = true;
      sv += dy / 14 / 2; queue();              // média dos dois dedos; o conteúdo acompanha os dedos
    }
  });
  function surfaceEnd(e) {
    const p = touches.get(e.pointerId); if (!p) return;
    const now = performance.now(), n = touches.size;
    touches.delete(e.pointerId); unring(e.pointerId);
    if (n === 1) {
      if (dragging) { dragging = false; click('left', false); lastTap = 0; }
      else if (e.type === 'pointerup' && !p.moved && now - p.t < TAP_MS) { tapClick('left'); lastTap = now; }
    } else if (n === 2 && e.type === 'pointerup' && !twoMoved && now - twoStart < TAP_MS + 100) {
      tapClick('right');                       // toque com dois dedos = clique direito
    }
  }
  surface.addEventListener('pointerup', surfaceEnd); surface.addEventListener('pointercancel', surfaceEnd);

  // ---------- Teclado do celular + teclas extras ----------
  const kb = $('kbInput'), sheet = $('keysheet');
  const mods = new Set();                  // modificadores "armados" para a próxima tecla
  const takeMods = () => {
    const m = [...mods]; mods.clear();
    document.querySelectorAll('#keysheet [data-mod]').forEach((b) => b.classList.remove('on'));
    return m;
  };
  const WIN = '<svg class="i fill" viewBox="0 0 24 24" aria-hidden="true" style="stroke:none"><path d="M3 5.5l7.5-1v7H3zM11.5 4.3L21 3v8.5h-9.5zM3 12.5h7.5v7L3 18.5zM11.5 12.5H21V21l-9.5-1.3z"/></svg>';
  const ROW1 = [['key', 'esc', 'Esc'], ['key', 'tab', 'Tab'], ['key', 'home', 'Home'], ['key', 'end', 'End'],
    ['key', 'pageup', 'PgUp'], ['key', 'pagedown', 'PgDn'], ['key', 'insert', 'Ins'], ['fn']];
  const ROW2 = [['mod', 'meta', WIN], ['mod', 'ctrl', 'Ctrl'], ['mod', 'alt', 'Alt'], ['mod', 'shift', ico('arrow-big-up') + 'Shift', 'wide'],
    ['key', 'left', ico('arrow-left')], ['key', 'down', ico('arrow-down')], ['key', 'up', ico('arrow-up')], ['key', 'right', ico('arrow-right')]];
  function addKey(parent, [kind, name, label, extra]) {
    const b = document.createElement('button');
    b.type = 'button';
    // preventDefault no pointerdown impede o botão de roubar o foco, então o teclado do celular não fecha
    b.addEventListener('pointerdown', (e) => e.preventDefault());
    if (kind === 'fn') {
      b.className = 'k fn soft dark'; b.innerHTML = 'Fn<small>F1–F12</small>';
      b.addEventListener('click', () => { buzz(); $('frow').classList.toggle('hidden'); b.classList.toggle('on', !$('frow').classList.contains('hidden')); });
    } else {
      b.className = 'k soft' + (extra ? ' ' + extra : ''); b.innerHTML = label;
      if (kind === 'mod') {
        b.dataset.mod = name;
        b.addEventListener('click', () => { buzz(); mods.has(name) ? mods.delete(name) : mods.add(name); b.classList.toggle('on', mods.has(name)); });
      } else b.addEventListener('click', () => { buzz(); wsSend({ t: 'key', key: name, mods: takeMods() }); });
    }
    parent.appendChild(b);
  }
  ROW1.forEach((k) => addKey($('row1'), k));
  ROW2.forEach((k) => addKey($('row2'), k));
  for (let n = 1; n <= 12; n++) addKey($('frow'), ['key', 'f' + n, 'F' + n]);

  const FAB_ICON = (open) => ico(open ? 'x' : 'keyboard');
  $('fab').addEventListener('click', () => { if (document.activeElement === kb) kb.blur(); else { resetKb(); kb.focus(); } });
  let blurTimer = 0;
  kb.addEventListener('focus', () => {
    clearTimeout(blurTimer); sheet.classList.remove('hidden'); $('fab').innerHTML = FAB_ICON(true); $('hint').classList.add('hidden');
  });
  kb.addEventListener('blur', () => {
    blurTimer = setTimeout(() => { sheet.classList.add('hidden'); $('fab').innerHTML = FAB_ICON(false); $('hint').classList.remove('hidden'); }, 120);
  });

  // O que o usuário digita vira texto no PC. O campo guarda alguns caracteres invisíveis
  // para que o Backspace tenha o que apagar e a gente consiga enviá-lo ao PC.
  const SENTINEL = '​'.repeat(8);
  let last = SENTINEL, composing = false;
  function resetKb() { kb.value = SENTINEL; last = SENTINEL; try { kb.setSelectionRange(SENTINEL.length, SENTINEL.length); } catch (_) {} }
  kb.addEventListener('compositionstart', () => { composing = true; });
  kb.addEventListener('compositionend', () => { composing = false; setTimeout(resetKb, 0); });
  kb.addEventListener('input', () => {
    const v = kb.value;
    let p = 0; const m = Math.min(v.length, last.length);
    while (p < m && v[p] === last[p]) p++;            // trecho que não mudou
    const back = last.length - p;                      // caracteres apagados (ou trocados pela correção)
    const text = v.slice(p).replace(/​/g, '');
    last = v;
    if (back || text) wsSend({ t: 'text', back, text, mods: takeMods() });
    if (!composing) resetKb();
  });
  // Teclado físico (ou Bluetooth) ligado ao celular: teclas que não geram texto
  const PHYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', Escape: 'esc', Tab: 'tab',
    Delete: 'delete', Home: 'home', End: 'end', PageUp: 'pageup', PageDown: 'pagedown', Insert: 'insert' };
  kb.addEventListener('keydown', (e) => {
    const name = PHYS[e.key] || (/^F([1-9]|1[0-2])$/.test(e.key) ? e.key.toLowerCase() : null);
    if (!name) return;
    e.preventDefault(); wsSend({ t: 'key', key: name, mods: takeMods() });
  });

  paintJoin();
  paintStream();
})();
</script>
<script src="/static/pwa.js" defer></script>
</body>
</html>
